<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nonthawat Pinchai — Portfolio</title>
    <script>
      // GitHub Pages serves this file for any path it does not recognise, which
      // is every client-side route in this SPA. Rewrite the path into a query
      // string and bounce to index.html, where the companion snippet in
      // index.html restores it before React Router mounts.
      //
      // pathSegmentsToKeep is hardcoded because Vite copies public/ verbatim
      // without substituting import.meta.env.BASE_URL. 1 keeps the
      // /portfolio-website/ repo prefix.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
